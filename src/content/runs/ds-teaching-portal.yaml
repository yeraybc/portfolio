title: { en: "Data Science, step by step", es: "Data Science, paso a paso" }
status: running
lenses: [ai]
lens_rank: { ds: 8, quant: 8, ai: 2, de: 9 }
year: "2026"
stack: [Python, Jupyter, Claude Code]
summary:
  en: A course for classmates, friends and acquaintances, generated by orchestrating agents with different skills, aligned with what I have learned across my degree and courses. A system I built myself.
  es: Un curso para compañeros, amigos y conocidos, generado mediante la orquestación de agentes con distintas skills y alineado con lo que he aprendido en mis formaciones. Un sistema desarrollado por mí.
problem:
  en: "Help classmates, friends and acquaintances learn data science, from the fundamentals to specialist level, in a clear, simple and hands-on way: the way I would have liked to learn it."
  es: "Ayudar a compañeros, amigos y conocidos a aprender data science, desde los fundamentos hasta niveles de especialización, de forma clara, sencilla y didáctica: como me habría gustado aprenderlo a mí."
finding:
  en: Already used by a first group of friends, with positive feedback.
  es: Ya lo ha usado un primer grupo de amigos, con buen feedback.
headline_text: { en: "5-phase method", es: "Método en 5 fases" }
config:
  method:
    design:
      - { en: "1. theory at interview level, with real interview questions", es: "1. teoría a nivel de entrevista, con preguntas reales" }
      - { en: "2. a real-world analogy", es: "2. una analogía del mundo real" }
      - { en: "3. a 3–5 line code snippet", es: "3. un snippet de código de 3–5 líneas" }
      - { en: "4. condensed practice on a clean dataset", es: "4. práctica condensada sobre un dataset limpio" }
      - { en: "5. an end-to-end case study to close each module", es: "5. un caso integrador de principio a fin al cerrar cada módulo" }
    routing:
      en: each question is classified and sent to the specialist for its area; finance questions pair the finance specialist with the area one
      es: cada pregunta se clasifica y va al especialista de su área; si toca finanzas, el especialista de finanzas trabaja junto al del área
    roles:
      specialists:
        - { en: supervised learning, es: aprendizaje supervisado }
        - { en: unsupervised learning, es: aprendizaje no supervisado }
        - { en: deep learning with PyTorch, es: deep learning con PyTorch }
        - { en: data preparation and MLOps, es: preparación de datos y MLOps }
        - { en: quantitative finance, es: finanzas cuantitativas }
      director:
        en: coordinates the syllabus and decides what goes in by its cost-benefit for the learner
        es: coordina el temario y decide qué entra según su coste-oportunidad para quien aprende
    sources: { en: web search for real interview questions in each area, es: búsqueda web de preguntas reales de entrevista en cada área }
    output: { en: Jupyter notebooks, es: notebooks de Jupyter }
  status: { en: "in development, not yet published", es: "en desarrollo, aún sin publicar" }
decisions:
  - title: { en: One standard for every concept, es: Un mismo estándar para cada concepto }
    body:
      en: Every concept follows the same five phases, so the material stays consistent whichever specialist wrote it, and the director keeps the syllabus from growing beyond what is worth learning.
      es: Cada concepto sigue las mismas cinco fases, así que el material es coherente lo haya escrito el especialista que sea, y el director evita que el temario crezca más allá de lo que merece la pena aprender.
artifacts: {}
