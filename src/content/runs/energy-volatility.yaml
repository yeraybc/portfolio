title: { en: "Energy volatility: GARCH vs HAR vs neural nets", es: "Volatilidad en energía: GARCH vs HAR vs redes" }
status: research
lenses: [quant, ds]
lens_rank: { ds: 2, quant: 1, ai: 7, de: 7 }
year: "2026"
stack: [Python, PyTorch, arch, statsmodels, SciPy, pytest, GitHub Actions]
summary:
  en: Out-of-sample volatility forecasting and VaR backtesting for Brent and natural gas. Single-author paper in preparation for journal submission.
  es: Predicción de volatilidad fuera de muestra y backtesting del VaR en Brent y gas natural. Paper de autoría única en preparación para envío a journal.
problem:
  en: Energy commodity volatility feeds straight into regulatory market-risk capital under Basel. Do neural networks really forecast it better than GARCH, and does a better forecast give a better Value-at-Risk?
  es: La volatilidad de las materias primas energéticas entra directamente en el capital regulatorio por riesgo de mercado (Basilea). ¿Predicen de verdad mejor las redes neuronales que GARCH, y una mejor predicción da un mejor Value-at-Risk?
finding:
  en: "In natural gas the networks beat GARCH at the 1% level, but HAR, a linear model with 4 coefficients on the same range-based measure, matches or beats them. BiLSTM is statistically indistinguishable from HAR. The gain comes from modelling range-based variance, not from non-linearity, so the simpler model is the right choice."
  es: "En gas natural las redes baten a GARCH al 1 %, pero el HAR, un modelo lineal de 4 coeficientes sobre la misma medida de rango, las iguala o mejora. BiLSTM no se distingue estadísticamente del HAR. La ganancia viene de modelar la varianza de rango, no de la no linealidad, así que el modelo simple es la elección correcta."
business:
  en: "HAR and BiLSTM cut the average 99% VaR by about 160 and 154 basis points against GARCH with no extra violations. On a position of 1,500 natural gas futures (about $45M), that frees $2.1M to $2.2M of regulatory capital."
  es: "HAR y BiLSTM bajan el VaR99 % medio unos 160 y 154 puntos básicos frente a GARCH sin más excepciones. En una posición de 1.500 futuros de gas natural (unos 45 M USD), eso libera entre 2,1 y 2,2 M USD de capital regulatorio."
