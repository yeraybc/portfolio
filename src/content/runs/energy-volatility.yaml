config:
  data:
    assets: ["Brent (BZ=F, ICE)", { en: "Henry Hub natural gas (NG=F, NYMEX)", es: "gas natural Henry Hub (NG=F, NYMEX)" }]
    period: { en: "2018–2025, 2,013 daily returns", es: "2018–2025, 2.013 retornos diarios" }
    target: { en: Garman-Klass range estimator, es: estimador de rango de Garman-Klass }
  split:
    train: "2018–2022"
    validation: "2023"
    test: "2024–2025"
    embargo: { en: "5 sessions between blocks (López de Prado)", es: "5 sesiones entre bloques (López de Prado)" }
    refit_in_test: false
  models: ["GARCH(1,1)", "EGARCH(1,1)", "GJR-GARCH(1,1)", "HAR (Corsi)", "BiLSTM", "Temporal self-attention"]
  training: { en: "AdamW, cosine annealing, early stopping, 5 seeds", es: "AdamW, cosine annealing, early stopping, 5 semillas" }
  evaluation: [QLIKE, Diebold-Mariano, Model Confidence Set, Kupiec, Christoffersen, Basel traffic light]
  engineering: { en: "63 pytest tests, GitHub Actions CI, Makefile, Conda environment", es: "63 tests de pytest, CI en GitHub Actions, Makefile, entorno Conda" }
decisions:
  - title: { en: Add HAR to separate the two effects, es: Añadir el HAR para separar los dos efectos }
    body:
      en: HAR is estimated on the same range-based measure as the networks. That isolates "using range information" from "being non-linear", which is the question that actually matters.
      es: El HAR se estima sobre la misma medida de rango que las redes. Así se separa "usar información de rango" de "ser no lineal", que es la pregunta que de verdad importa.
  - title: { en: Embargo between splits, es: Embargo entre particiones }
    body:
      en: A 5-session embargo between train, validation and test avoids look-ahead bias, and no model is re-estimated on test.
      es: Un embargo de 5 sesiones entre entrenamiento, validación y test evita el sesgo de anticipación, y ningún modelo se reestima en test.
  - title: { en: "Significance, not just a lower number", es: "Significancia, no solo un número menor" }
    body:
      en: Diebold-Mariano with finite-sample corrections, the Model Confidence Set for multiple comparisons, VaR backtests and the Basel traffic light.
      es: Diebold-Mariano con correcciones para muestra finita, Model Confidence Set para las comparaciones múltiples, backtesting del VaR y semáforo de Basilea.
  - title: { en: Check robustness, es: Comprobar la robustez }
    body:
      en: An alternative proxy (Yang-Zhang), squared returns, and 5 random seeds for the networks, so the result does not depend on one initialisation.
      es: Un proxy alternativo (Yang-Zhang), retornos al cuadrado y 5 semillas para las redes, para que el resultado no dependa de una inicialización.
notes:
  - en: "In Brent, neither the networks nor HAR improve robustly on a plain GARCH(1,1)."
    es: "En Brent, ni las redes ni el HAR mejoran de forma robusta a un GARCH(1,1) simple."
  - en: The inverse leverage effect (asymmetric GARCH) is not confirmed for either asset.
    es: El efecto apalancamiento inverso (GARCH asimétricos) no se confirma en ningún activo.
  - en: "The repository is private until the paper is submitted; the LinkedIn post summarises it."
    es: "El repositorio es privado hasta el envío del paper; el post de LinkedIn lo resume."
