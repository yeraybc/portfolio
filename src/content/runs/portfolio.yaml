title: { en: This portfolio, es: Este portfolio }
status: production
lenses: [de, ai, ds]
lens_rank: { ds: 9, quant: 9, ai: 6, de: 4 }
year: "2026"
stack: [TypeScript, Astro, zod, Web Workers, Vitest, Playwright, GitHub Actions, Vercel]
summary:
  en: The site you are on, built like the rest of the projects. Typed content, a neural network with no libraries, and tests on every pull request.
  es: El sitio en el que estás, hecho como el resto de proyectos. Contenido tipado, una red neuronal sin librerías y tests en cada pull request.
problem:
  en: Show projects so that a recruiter gets the point in ten seconds and an engineer can check every figure, without a slow page that contradicts the message.
  es: Enseñar proyectos de forma que un recruiter capte la idea en diez segundos y un ingeniero pueda comprobar cada cifra, sin una página lenta que contradiga el mensaje.
finding:
  en: "The network works out location on its own: without the neighbourhood price it barely gets worse, while the linear model clearly does."
  es: "La red aprende sola dónde está cada vivienda: sin el precio del entorno apenas empeora, mientras que el modelo lineal sí lo nota."
headline_text: { en: "Lighthouse 95+ on mobile", es: "Lighthouse 95+ en móvil" }
engineering:
  - { label: { en: "Lighthouse mobile performance, home (median of 10 runs)", es: "Lighthouse móvil, rendimiento de la portada (mediana de 10 pasadas)" }, value: "96" }
  - { label: { en: "Lighthouse accessibility, best practices, SEO", es: "Lighthouse accesibilidad, buenas prácticas, SEO" }, value: "100 / 100 / 100" }
  - { label: { en: Live-run JavaScript (page + worker), es: JavaScript del live run (página + worker) }, value: "11.8 KB (5.2 KB gzip)" }
  - { label: { en: Automated tests, es: Tests automáticos }, value: "19 unit + 32 end-to-end" }
  - { label: { en: Languages, es: Idiomas }, value: "EN / ES, same content source" }
config:
  framework: { en: Astro (static output) with two React islands, es: Astro (salida estática) con dos islas de React }
  content: { en: "typed YAML collections validated with zod, one source for every page, /compare and /cv", es: "colecciones YAML tipadas y validadas con zod, una sola fuente para todas las páginas, /compare y /cv" }
  live_run:
    model: { en: "one-hidden-layer MLP (tanh, Adam), about 150 lines of TypeScript", es: "MLP de una capa oculta (tanh, Adam), unas 150 líneas de TypeScript" }
    runtime: { en: "Web Worker, no ML libraries", es: "Web Worker, sin librerías de ML" }
    data: { en: "2,000 Madrid homes (1,600 train / 400 validation) from MadridDataHouse", es: "2.000 viviendas de Madrid (1.600 de entrenamiento / 400 de validación) de MadridDataHouse" }
    baseline: { en: "OLS on the same features, refitted for every feature set", es: "OLS con las mismas variables, reajustado en cada conjunto" }
    feature_sets:
      - { en: all features, es: todas las variables }
      - { en: without neighbour price, es: sin precio del entorno }
      - { en: location only, es: solo el entorno }
      - { en: house only, es: solo la vivienda }
  charts: { en: "hand-written SVG, one visual system", es: "SVG escrito a mano, un solo sistema visual" }
  quality: [Vitest, { en: Playwright on desktop and 360 px, es: Playwright en escritorio y a 360 px }, prefers-reduced-motion, { en: no layout shift, es: sin saltos de layout }]
  ci: { en: GitHub Actions on every push and pull request, es: GitHub Actions en cada push y pull request }
  hosting: Vercel
decisions:
  - title: { en: Content as typed data, es: El contenido como datos tipados }
    body:
      en: Every project is a YAML file checked by a zod schema. The pages, the compare view and the one-page CV read the same files, so a figure cannot drift between them.
      es: Cada proyecto es un YAML validado con un esquema zod. Las páginas, la comparación y el CV de una página leen los mismos archivos, así que una cifra no puede variar de un sitio a otro.
  - title: { en: A small network with no libraries, es: Una red pequeña sin librerías }
    body:
      en: TensorFlow.js would weigh hundreds of kilobytes for a 16-unit network. A hand-written MLP in a Web Worker keeps the page responsive, and a unit test checks that the browser reproduces the published curve exactly.
      es: TensorFlow.js pesaría cientos de kilobytes para una red de 16 neuronas. Un MLP escrito a mano en un Web Worker mantiene la página fluida, y un test unitario comprueba que el navegador reproduce exactamente la curva publicada.
  - title: { en: A fair baseline for every test, es: Un baseline justo en cada prueba }
    body:
      en: When the visitor removes features, the OLS is refitted on the same subset. Comparing a reduced network with the full OLS would make the network look worse than it is.
      es: Cuando el visitante quita variables, el OLS se reajusta sobre el mismo subconjunto. Comparar una red reducida con el OLS completo haría que la red pareciera peor de lo que es.
  - title: { en: "The figures change with the focus, the headline does not", es: "Las cifras cambian con el enfoque, el titular no" }
    body:
      en: "?lens=ai, quant or de reorders projects and swaps the home figures with CSS only. The headline stays Data Scientist."
      es: "?lens=ai, quant o de reordena los proyectos y cambia las cifras de la portada solo con CSS. El titular sigue siendo Data Scientist."
notes:
  - en: "An assistant that answers questions about these projects, with citations and its own evaluation set, is planned. It waits for a server-side API key with a spending cap."
    es: "Hay previsto un asistente que responda preguntas sobre estos proyectos, con citas y su propio conjunto de evaluación. Espera a tener una API key en el servidor con tope de gasto."
artifacts:
  repo: https://github.com/yeraybc/portfolio
