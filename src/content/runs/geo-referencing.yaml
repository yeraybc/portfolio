summary:
  en: Assigning coordinates to more than 250,000 property listings whose exact address is often hidden.
  es: Asignar coordenadas a más de 250.000 anuncios inmobiliarios cuya dirección exacta suele estar oculta.
problem:
  en: The vast majority of properties for sale on Idealista do not give an exact address. Some listings have a precise location, others only a street, an approximate radius or a region, and older ones can no longer be checked online. Yet that exact location is needed to value those properties later on.
  es: La gran mayoría de anuncios en venta de Idealista no proporcionan una dirección exacta. Hay anuncios con ubicación precisa, otros solo con la calle, un radio aproximado o la comunidad autónoma, y los antiguos ya no se pueden verificar online. Sin embargo, esa ubicación exacta es necesaria para poder valorar esos inmuebles en el futuro.
headline_text: { en: "250k+ listings", es: "+250k anuncios" }
